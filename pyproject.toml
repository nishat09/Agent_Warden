[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwarden"
version = "0.1.0"
description = "Runtime security firewall for LLM agents: prompt injection, taint tracking, exfiltration and excessive-agency defense"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
agentwarden = "agentwarden.cli:main"

[tool.setuptools.packages.find]
include = ["agentwarden*"]

[tool.setuptools.package-data]
agentwarden = ["policies/*.yaml", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
